<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomodoroStudy</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<!-- config for the shader.js -->
<body
    fc-fluid-gradient="component"
    fc-fluid-gradient-hover="true"
    fc-fluid-gradient-brush-size="1.0"
    fc-fluid-gradient-brush-strength="0.7"
    fc-fluid-gradient-distortion-amount="0.45"
    fc-fluid-gradient-fluid-decay="0.985"
    fc-fluid-gradient-trail-length="1.65"
    fc-fluid-gradient-stop-decay="0.85"
    fc-fluid-gradient-flow-speed="1"
    fc-fluid-gradient-idle-speed="0.7"
    fc-fluid-gradient-color-1="#98F5E1"
    fc-fluid-gradient-color-2="#B5B9FF"
    fc-fluid-gradient-color-3="#FFF07C"
    fc-fluid-gradient-color-4="#FFB7B2"
    fc-fluid-gradient-color-intensity="0.8"
    fc-fluid-gradient-softness="1.5"
    fc-fluid-gradient-dpr-max="1.5">
    <!-- main container -->
    <div class="container">
        <div class="center-box">
                <h1>PomodoroStudy</h1>
                <p>A simple study timer app that has different sessions!</p>
                <p>Click the buttons below to start, pause, and reset the timer.</p>
            <div class="buttonrow">
                <button id="startbutton" class="normalbtn">Start</button>
                <button id="pausebutton" class="normalbtn">Pause</button>
                <button id="resetbutton" class="normalbtn">Reset</button>
            </div>
            <div id="timedisplay">25:00</div>
        </div>
    </div>
    </div>
    <!-- shader canvas (background) -->
    <script type="module" src="scripts/shader.js"></script>
    <script src="scripts/shaderchange.js"></script>
    <script src="scripts/timer.js"></script>
    <!-- <script src="./visualizer.js"></script>
    <script>
        spawnVisualizer({ color: "#ff7500" });
        audioUrl: ""
    </script> -->
    <!-- virtual pet script -->
    <script src="pet.js"></script>
    <!-- startup script -->
    <script src="startup.js"></script>
</body>
</html>
